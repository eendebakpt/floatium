name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Every entry is a final release (3.15.0 shipped 2026-10-09;
          # setup-python's manifest carries 3.15 and 3.15t for all three
          # OSes), so no allow-prereleases.
          python-version: ${{ matrix.python }}

      - name: Install build deps and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Show info
        run: |
          python -c "import floatium; print(floatium.info())"

      - name: Run unit + parity + edge tests
        run: |
          python -m pytest tests -x --tb=short --ignore=tests/cpython_suite

      - name: Run vendored CPython tests (if any)
        run: |
          python -m pytest tests/cpython_suite --tb=short || true
        shell: bash

  test-all-backends:
    # Every optional backend (fmt, ryu_opt, zmij, wuffs, stock) compiled
    # in, so tests/test_backends.py can check each one against stock.
    # The wheels only ship the defaults; this job is what keeps the
    # others honest — and, on all three OSes, what proves the pure-C
    # zmij.c / zmij_dtoa.c build with MSVC and Apple clang as well.
    name: test / all backends / py3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install with every backend compiled in
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" \
            -C cmake.define.FLOATIUM_FORMAT_BACKEND=all \
            -C cmake.define.FLOATIUM_PARSE_BACKEND=all

      - name: Show info
        run: |
          python -c "import floatium; print(floatium.info())"

      - name: Run unit + parity + edge + backend tests
        run: |
          python -m pytest tests -x --tb=short --ignore=tests/cpython_suite
